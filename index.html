<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokédex</title>
    <link rel="stylesheet" type="text/css" href="css/style.css" />
  </head>
  <body>
    <header class="sticky-top">
      <nav class="navbar container-md">
        <a class="navbar-brand" href="index.html">Pokédex</a>
        <label for="pokemon-search" style="display:none">Search</label>
        <input
          type="search"
          id="pokemon-search"
          name="pokemon-search"
          placeholder="Search Pokémon…"
          autocomplete="off"
        />
      </nav>
    </header>

    <main class="container">
      <ul class="pokemon-list"></ul>
      <div id="modal-container" class="poke-modal-overlay" aria-hidden="true"></div>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
